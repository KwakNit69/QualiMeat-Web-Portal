<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QualiMeat - Stall Details</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/details.css">
    <link rel="stylesheet" href="css/redesign.css">
    <link rel="stylesheet" href="css/mockup-theme.css">
    <link rel="stylesheet" href="css/vendor-v2.css">
    <link rel="stylesheet" href="css/premium.css">
    <script src="js/theme-init.js"></script>
    <script src="js/header.js"></script>

    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
</head>

<body class="details-body">

    <global-header back-url="index.html"></global-header>

    <main class="details-layout">
        <section class="vendor-summary-card">
            <div class="vendor-left">
                <img id="stall-img" src="" alt="Vendor Stall" class="skeleton skel-img"
                    onload="this.classList.remove('skeleton')">

                <div>
                    <h2 id="stall-name">Loading vendor...</h2>
                    <p id="stall-owner">Loading stall information...</p>
                </div>
            </div>

            <div class="summary-stats">
                <div class="stat-box">
                    <span id="totalSessions">
                        <div class="skeleton skel-stat"></div>
                    </span>
                    <small>Sessions</small>
                </div>
                <div class="stat-box flagged">
                    <span id="flaggedSessions">
                        <div class="skeleton skel-stat"></div>
                    </span>
                    <small>Flagged</small>
                </div>
            </div>
        </section>

        <section id="warningBox"></section>

        <section class="logs-section">
            <h3>Official Inspection Logs</h3>
            <div id="cert-grid" class="logs-list">
                <div class="skeleton skel-card" style="height: 280px; width: 100%;"></div>
                <div class="skeleton skel-card" style="height: 280px; width: 100%;"></div>
            </div>
        </section>
    </main>

    <div id="evidenceModal" class="modal-overlay hidden" onclick="closeEvidenceModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2>Inspection Evidence</h2>
                <button class="close-modal-btn" onclick="closeEvidenceModal()">✕</button>
            </div>
            <p class="modal-subtitle">Visual verification from the QualiMeat AI scan.</p>

            <div class="table-responsive">
                <table class="evidence-table">
                    <thead>
                        <tr>
                            <th>Evidence Photo</th>
                            <th>Meat Cut</th>
                            <th>AI Result</th>
                        </tr>
                    </thead>
                    <tbody id="evidenceTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/dashboard.js"></script>
    <script type="module" src="js/certificates.js"></script>
</body>

</html>
