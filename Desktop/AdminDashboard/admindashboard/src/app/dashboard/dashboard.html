<div id="batch-list">
  <div *ngFor="let batch of inspections$ | async" 
       class="batch-card" 
       [class.flagged]="batch.isFlagged">
    
    <div class="icon">{{ batch.isFlagged ? '⚠️' : '📋' }}</div>
    
    <div class="details">
      <div style="display:flex; justify-content:space-between;">
        <strong>Batch #QM-{{ batch.displayId }} • Stall {{ batch.stallNumber }}</strong>
        <small style="color:#707B81">Just now</small>
      </div>
      
      <p style="font-size:12px; color:#707B81; margin: 8px 0;">
        {{ batch.description }}
      </p>
      
      <span class="badge" 
            [style.background]="batch.isFlagged ? '#FFEEEE' : '#E8FAF0'" 
            [style.color]="batch.isFlagged ? '#FF5252' : '#00E676'">
        {{ batch.statusText }}
      </span>
    </div>
  </div>
</div>
